<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#334f84">
  <title>JoyVet CDS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-shell">
    <nav id="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="" width="32" height="32" aria-hidden="true">
        JoyVet CDS
      </div>
      <ul class="nav-list" role="list">
        <li><a href="#/" class="nav-link" data-view="dashboard">Dashboard</a></li>
        <li><a href="#/owners" class="nav-link" data-view="owners">Owners</a></li>
        <li><a href="#/patients" class="nav-link" data-view="patients">Patients</a></li>
        <li><a href="#/search" class="nav-link" data-view="search">Search</a></li>
        <li><a href="#/settings" class="nav-link" data-view="settings">Settings</a></li>
      </ul>
    </nav>

    <div id="content-wrapper">
      <div id="offline-banner" class="system-banner system-banner--warning" hidden role="status">
        Offline — changes will sync when reconnected
      </div>
      <div id="backup-banner" class="system-banner system-banner--info" hidden role="status">
        Backup overdue — <a href="#/settings">export your data</a> to keep an off-site copy.
      </div>
      <main id="main-content" role="main">
        <div id="app"></div>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
